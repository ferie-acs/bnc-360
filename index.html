<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>BNC 360 CEDEAO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout : rail d'icônes + panneau de menu clair, barre supérieure à pastilles, grille de cartes blanches à coins de 10px, vert CEDEAO #186C3E et marron terre #90482A tirés de l'emblème */
:root{
  --bg:#FBFCFA; --surface:#FFFFFF; --sunk:#F3F6F2; --field:#F1F4F0; --line:#E8EDE7; --line-2:#D9E1D8;
  --ink:#14281C; --muted:#5E6E63; --faint:#97A49B;
  --brand:#186C3E; --brand-2:#2F8F5B; --brand-ink:#FFFFFF; --brand-soft:#E2F1E7; --brand-soft-2:#C2E1CD;
  --hero-a:#13582F; --hero-b:#2A8551; --accent:#A9542F; --accent-hi:#E09A6E; --earth:#90482A;
  --gold:#8F4526; --gold-soft:#F6E5DA;
  --ok:#157A47; --ok-soft:#DFF2E6; --warn:#B45309; --warn-soft:#FCEBD7; --crit:#C8322A; --crit-soft:#FBE5E3; --info:#1F6F8B; --info-soft:#E0EEF3; --neutral:#5E6E63; --neutral-soft:#EEF2ED;
  --c-conge:#A9542F; --c-mission:#1F6F8B; --c-absent:#C8322A; --c-present:#186C3E; --c-we:#EEF2ED;
  --cal-rdv:#186C3E; --cal-rdv-soft:#E2F1E7; --cal-mis:#1F6F8B; --cal-mis-soft:#E0EEF3; --cal-con:#A9542F; --cal-con-soft:#F6E5DA; --cal-jal:#4F7F1E; --cal-jal-soft:#EAF3DC; --cal-cou:#C8322A; --cal-cou-soft:#FBE5E3; --cal-ins:#6A4C93; --cal-ins-soft:#EEE8F6; --cal-evt:#0F766E; --cal-evt-soft:#DDF3F0; --cal-sta:#3D4F7A; --cal-sta-soft:#E6EAF3; --cal-fer:#5E6E63; --cal-fer-soft:#EEF2ED;
  --shadow:0 5px 10px rgba(16,60,34,.035);
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151B17; --surface:#1C241F; --sunk:#202A23; --field:#25302A; --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.11);
  --ink:#F1F5F2; --muted:#A3B0A7; --faint:#6F7D73;
  --brand:#4CB07A; --brand-2:#74C996; --brand-ink:#08140D; --brand-soft:#183526; --brand-soft-2:#22513A;
  --hero-a:#0F4A28; --hero-b:#1F6E44; --accent:#C9714A; --accent-hi:#E8A47C; --earth:#D98A5F;
  --gold:#E39A6E; --gold-soft:#3A2419;
  --ok:#4CC28A; --ok-soft:#143526; --warn:#F0A04B; --warn-soft:#3A2810; --crit:#FF6B5E; --crit-soft:#3D1D1A; --info:#6FB4CF; --info-soft:#15303A; --neutral:#A3B0A7; --neutral-soft:#26302A;
  --c-conge:#C9714A; --c-mission:#3F8FAD; --c-absent:#E2554B; --c-present:#4CB07A; --c-we:#25302A; --shadow:none;
  --cal-rdv:#6CC793; --cal-rdv-soft:#183526; --cal-mis:#6FB4CF; --cal-mis-soft:#15303A; --cal-con:#E39A6E; --cal-con-soft:#3A2419; --cal-jal:#A6D36B; --cal-jal-soft:#26341A; --cal-cou:#FF7A6E; --cal-cou-soft:#3D1D1A; --cal-ins:#B9A3E0; --cal-ins-soft:#2C2440; --cal-evt:#3CCFC0; --cal-evt-soft:#12302D; --cal-sta:#A3B3E6; --cal-sta-soft:#232A40; --cal-fer:#A3B0A7; --cal-fer-soft:#26302A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151B17; --surface:#1C241F; --sunk:#202A23; --field:#25302A; --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.11);
  --ink:#F1F5F2; --muted:#A3B0A7; --faint:#6F7D73;
  --brand:#4CB07A; --brand-2:#74C996; --brand-ink:#08140D; --brand-soft:#183526; --brand-soft-2:#22513A;
  --hero-a:#0F4A28; --hero-b:#1F6E44; --accent:#C9714A; --accent-hi:#E8A47C; --earth:#D98A5F;
  --gold:#E39A6E; --gold-soft:#3A2419;
  --ok:#4CC28A; --ok-soft:#143526; --warn:#F0A04B; --warn-soft:#3A2810; --crit:#FF6B5E; --crit-soft:#3D1D1A; --info:#6FB4CF; --info-soft:#15303A; --neutral:#A3B0A7; --neutral-soft:#26302A;
  --c-conge:#C9714A; --c-mission:#3F8FAD; --c-absent:#E2554B; --c-present:#4CB07A; --c-we:#25302A; --shadow:none;
  --cal-rdv:#6CC793; --cal-rdv-soft:#183526; --cal-mis:#6FB4CF; --cal-mis-soft:#15303A; --cal-con:#E39A6E; --cal-con-soft:#3A2419; --cal-jal:#A6D36B; --cal-jal-soft:#26341A; --cal-cou:#FF7A6E; --cal-cou-soft:#3D1D1A; --cal-ins:#B9A3E0; --cal-ins-soft:#2C2440; --cal-evt:#3CCFC0; --cal-evt-soft:#12302D; --cal-sta:#A3B3E6; --cal-sta-soft:#232A40; --cal-fer:#A3B0A7; --cal-fer-soft:#26302A;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--muted);font-family:var(--f-body);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-body);margin:0;text-wrap:balance;color:var(--ink);letter-spacing:-.005em}
h1{font-size:1.35rem;font-weight:600;line-height:1.2}
h2{font-size:.95rem;font-weight:600}
h3{font-size:.9rem;font-weight:600}
p{margin:0}
b,strong{color:var(--ink);font-weight:600}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ico{width:18px;height:18px;flex:none}
.ico.sm{width:15px;height:15px}
.ico.xs{width:13px;height:13px}
.mono{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;font-size:.93em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.eyebrow{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- Structure ---------- */
.app{display:grid;grid-template-columns:auto minmax(0,1fr);min-height:100%}
.side{display:grid;grid-template-columns:58px 214px;position:sticky;top:0;height:100vh;height:100dvh;background:var(--surface);border-right:1px solid var(--line);padding-left:env(safe-area-inset-left,0px)}
.app.collapsed .side{grid-template-columns:58px}
.app.collapsed .panel{display:none}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-right:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;margin-bottom:22px}
.logo svg{width:22px;height:22px}
.rail button{width:36px;height:36px;border-radius:9px;border:0;background:none;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.rail button:hover{background:var(--sunk);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.rail hr{width:22px;border:0;border-top:1px solid var(--line-2);margin:8px 0}
.panel{display:flex;flex-direction:column;gap:22px;padding:18px 14px 16px;overflow-y:auto;min-width:0}
.brand{padding:4px 6px 0;min-height:44px}
.brand b{font-size:1.02rem;display:block;line-height:1.2}
.brand small{font-size:.72rem;color:var(--muted);display:block;line-height:1.35}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-lbl{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);padding:12px 8px 6px;font-weight:600}
.nav-lbl:first-child{padding-top:0}
.nav button{display:flex;align-items:center;gap:10px;padding:7px 8px;border:0;background:none;border-radius:7px;color:var(--ink);cursor:pointer;text-align:left;font-size:.86rem;font-weight:500;white-space:nowrap}
.nav button .ico{color:var(--muted)}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{color:var(--brand)}
.nav button[aria-current="page"] .ico{color:var(--brand)}
.nav .badge{margin-left:auto;background:var(--brand);color:#fff;font-size:.66rem;font-weight:600;border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.promo{margin-top:auto;background:var(--sunk);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;font-size:.78rem}
.promo h3{font-size:.92rem}
.promo .btn{align-self:flex-start}
.promo .btn.armed{background:var(--crit);border-color:var(--crit)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding-block:11px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.icon-btn{width:34px;height:34px;border-radius:8px;border:0;background:none;display:grid;place-items:center;color:var(--ink);cursor:pointer;position:relative;flex:none}
.icon-btn:hover{background:var(--sunk)}
.icon-btn.dot::after{content:"";position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--brand);border:1.5px solid var(--surface)}
.gsearch{position:relative;flex:1;max-width:330px}
.gsearch .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.gsearch input{width:100%;border:0;background:var(--field);border-radius:8px;padding:8px 12px 8px 33px;color:var(--ink)}
.gsearch input::placeholder{color:var(--faint)}
.gs-res{position:absolute;top:calc(100% + 6px);left:0;width:min(440px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);max-height:380px;overflow:auto;padding:6px;z-index:40;box-shadow:0 14px 34px rgba(16,60,34,.12)}
.gs-res button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:7px;cursor:pointer;color:var(--muted)}
.gs-res button:hover,.gs-res button:focus-visible{background:var(--sunk)}
.gs-res .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--brand);padding:6px 8px 2px;font-weight:600}
.chip-top{display:inline-flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 6px 5px 14px;font-weight:500;color:var(--ink);cursor:pointer;white-space:nowrap;font-size:.84rem}
.chip-top .n{background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:2px 9px;font-weight:600;font-size:.78rem;font-variant-numeric:tabular-nums}
.chip-top:hover{border-color:var(--line-2)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.theme{display:flex;background:var(--field);border-radius:999px;padding:3px;gap:2px;margin-right:8px}
.theme button{width:28px;height:28px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.theme button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,60,34,.12)}
.profile .cbx-btn{border:0;background:none;padding:2px 4px 2px 10px;gap:10px;min-height:40px}
.profile .who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.profile .who b{font-size:.84rem}
.profile .who small{font-size:.74rem;color:var(--muted);display:flex;gap:3px;align-items:center}
.profile .av{width:36px;height:36px;font-size:.78rem}
.view{padding-block:14px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;width:100%;min-width:0}
.crumb{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--faint)}
.crumb button{border:0;background:none;padding:0;color:var(--faint);cursor:pointer;display:flex;gap:6px;align-items:center}
.crumb button:hover{color:var(--brand)}
.crumb .cur{color:var(--muted)}
.page-h{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.page-h .acts{display:flex;gap:8px;flex-wrap:wrap}
.page-h p.lead{color:var(--muted);margin-top:4px;max-width:66ch}

/* ---------- Composants ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.card-h h2{display:flex;gap:8px;align-items:center}
.card-h h2 .ico{color:var(--brand)}
.card-h .count{font-size:.76rem;color:var(--muted);font-weight:500;background:var(--sunk);border-radius:999px;padding:1px 8px}
.card-f{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin:0 -16px -16px;padding:10px 16px;font-size:.8rem}
.card-f button{border:0;background:none;color:var(--brand);cursor:pointer;display:grid;place-items:center;padding:2px}
.grid{display:grid;gap:16px;align-items:start}
.top4{align-items:stretch}
@media (min-width:901px){.g-73>:last-child:not(:first-child),.g-docs>:first-child,.g-cal>:last-child{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-73{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.top4{display:grid;gap:16px;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--shadow)}
.kpi-h{display:flex;gap:7px;align-items:center;color:var(--ink);font-size:.84rem;font-weight:600}
.kpi-h .ico{color:var(--brand)}
.kpi-v{font-size:1.6rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:-.01em}
.kpi-v small{font-size:.9rem;color:var(--muted);font-weight:500;margin-left:2px}
.kpi-s{font-size:.78rem;color:var(--muted)}
.kpi-s.crit{color:var(--crit)} .kpi-s.warn{color:var(--warn)} .kpi-s.ok{color:var(--ok)}
.tile{padding-bottom:0;gap:6px;overflow:hidden}
.tile .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;min-height:62px}
.tile .val{display:flex;gap:8px;align-items:center}
.tile .val b{font-size:1.65rem;font-weight:700;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.minibars{display:flex;align-items:flex-end;gap:6px;height:52px}
.minibars i{display:block;width:10px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--brand),var(--brand-2))}
.spark{margin:0 -16px;display:block;width:calc(100% + 32px);height:56px}
.tile .row{align-items:center;min-height:58px}
.tile{position:relative}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:90px;pointer-events:none;background:linear-gradient(180deg,var(--tone-bg),transparent)}
.tile>*{position:relative}
.tone-brand{--tone-bg:color-mix(in srgb,var(--brand-soft) 70%,transparent)} .tone-info{--tone-bg:color-mix(in srgb,var(--info-soft) 70%,transparent)} .tone-gold{--tone-bg:color-mix(in srgb,var(--gold-soft) 70%,transparent)} .tone-ok{--tone-bg:color-mix(in srgb,var(--ok-soft) 70%,transparent)}
.tile .card-h h2 .ti{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.tile .card-h h2 .ti .ico{color:currentColor}
.tile .val b{font-size:2rem}
.mrows{display:flex;flex-direction:column;gap:2px;flex:1}
.mrow{display:flex;align-items:center;gap:9px;padding:6px 8px;margin:0 -8px;border-radius:7px;font-size:.8rem;cursor:pointer;min-width:0}
.mrow:hover{background:var(--sunk)}
.mrow .ml{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.mrow .mb{width:60px;height:5px;border-radius:99px;background:var(--sunk);overflow:hidden;flex:none}
.mrow .mb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.mrow b{font-size:.78rem;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.mrow .dot{width:8px;height:8px;border-radius:50%;flex:none;background:currentColor}
.mrow .av.sm{width:22px;height:22px;font-size:.58rem}
.mrow>.av{width:24px;height:24px;font-size:.58rem}
.mrow .pill{flex:none}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mstats>div{border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:1px}
.mstats b{font-size:1.25rem;color:inherit;line-height:1.1;font-variant-numeric:tabular-nums}
.mstats span{font-size:.72rem;opacity:.9}
.tile .spark{margin-top:auto}
.tile .card-f{margin-top:auto;margin-bottom:0}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.55}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-crit{background:var(--crit-soft);color:var(--crit)} .t-info{background:var(--info-soft);color:var(--info)} .t-neutral{background:var(--neutral-soft);color:var(--neutral)} .t-brand{background:var(--brand-soft);color:var(--brand)} .t-gold{background:var(--gold-soft);color:var(--gold)}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500;font-size:.85rem;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,var(--line))}
.btn.danger.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.sm{padding:4px 11px;font-size:.78rem;border-radius:7px}
.btn.ghost{border-color:transparent;background:none;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.bar{height:7px;background:var(--sunk);border-radius:99px;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.bar.thin{height:5px}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:2px}
.li .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .t{font-weight:600;font-size:.86rem;color:var(--ink)}
.li .s{font-size:.79rem;color:var(--muted);overflow-wrap:anywhere}
.li .side-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.li-ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.empty{color:var(--muted);font-size:.85rem;padding:12px 0;display:flex;gap:8px;align-items:center}

.av{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:.7rem;font-weight:700;flex:none;letter-spacing:.02em}
.av.lg{width:44px;height:44px;font-size:.85rem}

.tw{overflow-x:auto;margin-inline:-2px}
table.tb{width:100%;border-collapse:collapse;font-size:.84rem}
.tb th{text-align:left;font-size:.78rem;color:var(--ink);font-weight:600;padding:10px;background:var(--sunk);white-space:nowrap}
.tb th:first-child{border-radius:8px 0 0 8px} .tb th:last-child{border-radius:0 8px 8px 0}
.tb td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--muted)}
.tb td b,.tb td .mono,.tb td.mono{color:var(--ink)}
.tb tr.click{cursor:pointer}
.tb tr.click:hover td{background:color-mix(in srgb,var(--brand-soft) 45%,transparent)}
.tb tr:last-child td{border-bottom:0}
.tb .obj{max-width:360px;color:var(--ink)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center;font-size:.86rem}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tabs .n{font-size:.7rem;background:var(--sunk);border-radius:99px;padding:0 7px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs button[aria-selected="true"] .n{background:var(--brand-soft);color:var(--brand)}
.seg-tabs{display:inline-flex;background:var(--field);border-radius:9px;padding:3px;gap:2px}
.seg-tabs button{border:0;background:none;border-radius:7px;padding:6px 12px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center;font-size:.84rem}
.seg-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,60,34,.1)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tin{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 11px;min-width:0;color:var(--ink)}
.tin.grow{flex:1;min-width:180px;max-width:360px}

/* Combobox avec recherche intégrée */
.cbx{position:relative;min-width:0}
.cbx-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;text-align:left;min-height:36px;color:var(--ink)}
.cbx-btn:hover{border-color:var(--brand-soft-2)}
.cbx-btn[disabled]{cursor:default;opacity:.75}
.cbx-btn .ico{color:var(--muted)}
.cbx-val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbx-val .ph{color:var(--faint)}
.cbx.inline{min-width:190px}
.cbx-pop{position:fixed;z-index:1000;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 14px 34px rgba(16,60,34,.14);display:flex;flex-direction:column;overflow:hidden;color:var(--ink)}
.cbx-search{display:flex;gap:8px;align-items:center;margin:8px;padding:7px 10px;border-radius:8px;background:var(--field);color:var(--muted)}
.cbx-search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--ink)}
.cbx-list{list-style:none;margin:0;padding:0 6px 6px;overflow:auto;max-height:240px}
.cbx-list li{padding:7px 9px;border-radius:6px;cursor:pointer;display:flex;gap:9px;align-items:center}
.cbx-list li .ck{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--brand)}
.cbx-list li .lb{flex:1;min-width:0}
.cbx-list li small{display:block;color:var(--muted);font-size:.75rem}
.cbx-list li.hi{background:var(--brand-soft)}
.cbx-list li[aria-selected="true"] .lb{font-weight:600;color:var(--brand)}
.cbx-list .none{color:var(--muted);cursor:default}

/* Formulaires / dialogue */
dialog.dlg{border:1px solid var(--line-2);border-radius:14px;padding:0;background:var(--surface);color:var(--muted);width:min(680px,calc(100vw - 32px));max-height:calc(100dvh - 40px)}
dialog.dlg.wide{width:min(860px,calc(100vw - 32px))}
dialog.dlg::backdrop{background:rgba(8,30,17,.45)}
.dlg-in{display:flex;flex-direction:column;max-height:calc(100dvh - 42px)}
.dlg-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.dlg-h .btn.ghost{color:var(--muted)}
.dlg-b{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.f .lbl{font-size:.8rem;font-weight:600;color:var(--ink)}
.f input[type=text],.f input[type=date],.f input[type=time],.f input[type=number],.f textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 10px;width:100%;color:var(--ink)}
.f textarea{min-height:70px;resize:vertical}
.f .hint{font-size:.75rem;color:var(--muted)}
.drop{border:1.5px dashed var(--brand-soft-2);background:color-mix(in srgb,var(--brand-soft) 40%,transparent);border-radius:9px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer;color:var(--brand);font-size:.85rem;font-weight:500}
.drop:hover{border-color:var(--brand)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.ferr{color:var(--crit);font-size:.82rem;font-weight:600}
.note{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:.82rem;display:flex;gap:9px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--info-soft);color:var(--info)}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.meta div{display:flex;flex-direction:column;gap:2px;min-width:0}
.meta dt{font-size:.74rem;color:var(--muted);font-weight:500}
.meta dd{margin:0;font-weight:500;color:var(--ink);overflow-wrap:anywhere}
.chip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.82rem;background:var(--sunk);color:var(--ink)}
.tl{display:flex;flex-direction:column;gap:0;position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.tl .e{position:relative;padding:4px 0 8px;font-size:.83rem;color:var(--ink)}
.tl .e::before{content:"";position:absolute;left:-17px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.tl .e span{color:var(--muted);font-size:.76rem;margin-right:8px}

/* Carte vedette en dégradé */
.hero{background:linear-gradient(150deg,var(--hero-a),var(--hero-b));color:#fff;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none}
.hero h2,.hero b{color:#fff}
.hero .muted{color:rgba(255,255,255,.75)}
.hero .gauge{position:relative;width:100%;max-width:230px;margin:2px auto 0}
.hero .gauge svg{width:100%;height:auto;display:block}
.hero .gauge .c{position:absolute;left:0;right:0;bottom:4px;text-align:center}
.hero .gauge .c b{font-size:1.75rem;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .gauge .c span{font-size:.78rem;opacity:.85}
.hero .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .duo b{font-size:1.15rem;display:flex;gap:7px;align-items:center;font-variant-numeric:tabular-nums}
.hero .duo b i{width:9px;height:9px;border-radius:2px;background:var(--accent-hi);display:inline-block}
.hero .duo span{font-size:.75rem;opacity:.8;display:block;padding-left:16px}
.hero .hbar{display:flex;gap:3px;height:9px}
.hero .hbar i{display:block;border-radius:3px;background:var(--accent-hi)}
.hero .hl{display:flex;flex-direction:column;gap:6px;font-size:.82rem}
.hero .hl div{display:flex;justify-content:space-between;gap:8px}
.hero .hl i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--accent-hi);margin-right:8px}
.hero .hl b{font-weight:600}
.hero .hp{display:flex;flex-direction:column;gap:2px}
.hero .hp>div{display:grid;grid-template-columns:minmax(0,1fr) 64px 40px;gap:10px;align-items:center;font-size:.8rem;padding:5px 6px;margin:0 -6px;border-radius:7px;cursor:pointer}
.hero .hp>div:hover{background:rgba(255,255,255,.08)}
.hero .hp span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.92}
.hero .hpb{height:5px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.hero .hpb i{display:block;height:100%;border-radius:99px;background:var(--accent-hi)}
.hero .hp b{text-align:right;font-size:.78rem;font-variant-numeric:tabular-nums}
.hero-cta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-radius:9px;padding:10px 12px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;text-align:left;font:inherit}
.hero-cta:hover{background:rgba(255,255,255,.2)}
.hero-cta b{display:block;font-size:.84rem}
.hero-cta small{opacity:.8;font-size:.76rem}
.donut{display:flex;gap:16px;align-items:center}
.donut svg{width:118px;height:118px;flex:none}
.donut .lg{display:flex;flex-direction:column;gap:7px;font-size:.8rem;flex:1;min-width:0}
.donut .lg div{display:flex;justify-content:space-between;gap:6px}
.donut .lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px}
.donut .lg b{font-variant-numeric:tabular-nums}
.wk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.78rem;margin-bottom:8px}
.wk-h b{font-size:.84rem}
.wk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.wk .d{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.72rem;min-width:0}
.wk .col{width:100%;height:70px;background:var(--sunk);border-radius:7px;display:flex;align-items:flex-end;overflow:hidden}
.wk .col i{display:block;width:100%;background:var(--brand-soft-2);border-radius:7px 7px 0 0}
.wk .d.today .col i{background:linear-gradient(180deg,var(--brand),var(--brand-2))}
.wk .d.past{opacity:.6}
.wk .d b{font-size:.82rem;font-variant-numeric:tabular-nums}
.wk .d span{color:var(--muted)}
.wk .d.today span{color:var(--brand);font-weight:600}
.away{display:flex;align-items:center;gap:10px;font-size:.78rem}
.away .stack{display:flex}
.away .stack .av{width:28px;height:28px;border:2px solid var(--surface);margin-left:-8px;font-size:.64rem}
.away .stack .av:first-child{margin-left:0}

/* Calendrier */
.c-rdv{--k:var(--cal-rdv);--ks:var(--cal-rdv-soft)} .c-mis{--k:var(--cal-mis);--ks:var(--cal-mis-soft)} .c-con{--k:var(--cal-con);--ks:var(--cal-con-soft)} .c-jal{--k:var(--cal-jal);--ks:var(--cal-jal-soft)} .c-cou{--k:var(--cal-cou);--ks:var(--cal-cou-soft)} .c-ins{--k:var(--cal-ins);--ks:var(--cal-ins-soft)} .c-evt{--k:var(--cal-evt);--ks:var(--cal-evt-soft)} .c-sta{--k:var(--cal-sta);--ks:var(--cal-sta-soft)} .c-fer{--k:var(--cal-fer);--ks:var(--cal-fer-soft)}
.li-ico[class*=" c-"]{background:var(--ks);color:var(--k)}
.g-cal{grid-template-columns:minmax(0,1fr) 330px}
.cal-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav h2{font-size:1.1rem;margin-left:8px}
.cal-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cal{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--sunk)}
.cal-head span{padding:8px 10px;font-size:.76rem;font-weight:600;color:var(--ink)}
.cal-week{position:relative;border-top:1px solid var(--line);--t:32px}
.cal-week.allday{--t:6px;border-top:0;flex:1}
.cal-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-cell{min-height:calc(var(--t) + var(--l)*22px + 70px);border-left:1px solid var(--line);padding:calc(var(--t) + var(--l)*22px) 5px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative;min-width:0}
.cal-week.allday .cal-cell{min-height:calc(var(--t) + var(--l)*22px + 30px)}
.cal-cell:first-child{border-left:0}
.cal-cell.we{background:color-mix(in srgb,var(--sunk) 70%,transparent)}
.cal-cell.out{background:var(--sunk)}
.cal-cell.out .cal-num{color:var(--faint)}
.cal-cell:hover{background:color-mix(in srgb,var(--brand-soft) 35%,transparent)}
.cal-cell.sel{background:color-mix(in srgb,var(--brand-soft) 70%,transparent)}
.cal-num{position:absolute;top:6px;left:6px;width:23px;height:23px;display:grid;place-items:center;border-radius:50%;font-size:.78rem;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.cal-cell.today .cal-num{background:var(--brand);color:#fff}
.cal-chip{display:flex;gap:4px;align-items:center;font-size:.71rem;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;font-weight:500;background:var(--ks);color:var(--k);min-width:0}
.cal-chip b{font-weight:700;flex:none}
.cal-chip span{overflow:hidden;text-overflow:ellipsis}
.cal-chip.done{opacity:.6;text-decoration:line-through}
.cal-more{font-size:.7rem;color:var(--brand);font-weight:600;padding-left:4px}
.cal-span{position:absolute;top:calc(var(--t) + var(--lane)*22px);left:calc(var(--c)*100%/7 + 3px);width:calc(var(--n)*100%/7 - 6px);height:19px;border-radius:5px;border:0;background:var(--k);color:var(--surface);font:600 .71rem/19px var(--f-body);padding:0 8px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;z-index:1}
.cal-span.cl{left:calc(var(--c)*100%/7);width:calc(var(--n)*100%/7 - 3px);border-top-left-radius:0;border-bottom-left-radius:0}
.cal-span.cr{width:calc(var(--n)*100%/7 - 3px);border-top-right-radius:0;border-bottom-right-radius:0}
.cal-span.cl.cr{width:calc(var(--n)*100%/7)}
.cal-span.c-con{background:var(--accent);color:#fff}
.cal-span.c-con.pending{background:repeating-linear-gradient(135deg,var(--accent) 0 6px,color-mix(in srgb,var(--accent) 45%,var(--surface)) 6px 12px)}
.cal-span.pending{background:repeating-linear-gradient(135deg,var(--k) 0 6px,color-mix(in srgb,var(--k) 62%,var(--surface)) 6px 12px)}
.tweek{min-width:720px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tw-head{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));background:var(--sunk)}
.tw-dh{border:0;background:none;padding:8px 6px;display:flex;gap:6px;align-items:baseline;justify-content:center;cursor:pointer;color:var(--muted);font-size:.78rem}
.tw-dh b{font-size:1rem;color:var(--ink);width:28px;height:28px;display:inline-grid;place-items:center;border-radius:50%}
.tw-dh.today b{background:var(--brand);color:#fff}
.tw-dh.sel{background:color-mix(in srgb,var(--brand-soft) 70%,transparent)}
.tw-all{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line-2)}
.tw-lbl{width:56px;flex:none;font-size:.7rem;color:var(--muted);padding:8px 6px;border-right:1px solid var(--line)}
.tg{position:relative;display:flex;overflow:hidden}
.tg-times{width:56px;flex:none;position:relative;border-right:1px solid var(--line)}
.tg-times span{position:absolute;right:8px;transform:translateY(-50%);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tg-times span:first-child{transform:none;top:2px!important}
.tg-cols{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background-image:repeating-linear-gradient(180deg,var(--line) 0 1px,transparent 1px var(--px))}
.tg-col{position:relative;border-left:1px solid var(--line);cursor:pointer;min-width:0}
.tg-col:first-child{border-left:0}
.tg-col.we{background:color-mix(in srgb,var(--sunk) 70%,transparent)}
.tg-col.today{background:color-mix(in srgb,var(--brand-soft) 35%,transparent)}
.tg-ev{position:absolute;left:3px;right:3px;border-radius:6px;padding:4px 6px;background:var(--ks);color:var(--k);font-size:.72rem;line-height:1.25;overflow:hidden;display:flex;flex-direction:column;z-index:1}
.tg-ev span{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-ev small{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-now{position:absolute;left:0;right:0;height:2px;background:var(--crit);z-index:2}
.tg-now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--crit)}
@media (max-width:1180px){.g-cal{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){
  .cal-cell{padding-left:2px;padding-right:2px;min-height:calc(var(--t) + var(--l)*12px + 34px);padding-top:calc(var(--t) + var(--l)*12px)}
  .cal-chip{font-size:0;padding:0;height:6px;width:6px;border-radius:50%;background:var(--k)}
  .cal-chip b,.cal-chip span{display:none}
  .cal-cell{flex-direction:row;flex-wrap:wrap;align-content:flex-start}
  .cal-span{height:8px;font-size:0;top:calc(var(--t) + var(--lane)*12px);padding:0}
  .cal-more{font-size:.62rem;width:100%}
  .cal-num{font-size:.72rem}
  .cal-head span{padding:6px 4px;text-align:center}
}

/* Modules */
.hb{display:flex;flex-direction:column;gap:10px}
.hb-r{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.8rem}
.hb-l{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-r b{min-width:34px;text-align:right}
.stack-av{display:inline-flex}
.stack-av .av{width:26px;height:26px;font-size:.6rem;border:2px solid var(--surface);margin-left:-7px}
.stack-av .av:first-child{margin-left:0}
.stack-av .av.more{background:var(--sunk);color:var(--muted)}
.rules{display:flex;flex-direction:column}
.rules>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:.84rem;flex-wrap:wrap}
.rules>div:first-child{border-top:0}
.rules>div>span:first-child{color:var(--ink)}
.rules>div>span:last-child{display:flex;gap:8px;align-items:center;color:var(--muted)}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.g-docs{grid-template-columns:260px minmax(0,1fr)}
.flist{display:flex;flex-direction:column;gap:2px}
.flist button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--ink);font-size:.84rem}
.flist button small{display:block;color:var(--muted);font-size:.72rem}
.flist button:hover{background:var(--sunk)}
.flist button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.flist .n{font-size:.72rem;color:var(--muted);background:var(--sunk);border-radius:99px;padding:0 8px;font-variant-numeric:tabular-nums}
.flist button.on .n{background:var(--surface);color:var(--brand)}
.steps{display:flex;gap:4px}
.steps span{flex:1;text-align:center;font-size:.74rem;padding:6px 4px;border-radius:6px;background:var(--sunk);color:var(--muted);font-weight:500}
.steps span.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.odj{margin:0;padding-left:20px;color:var(--ink);display:flex;flex-direction:column;gap:4px;font-size:.86rem}
textarea:disabled,input:disabled{opacity:.75}
@media (max-width:1000px){.g-docs{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.hb-r{grid-template-columns:minmax(0,110px) minmax(0,1fr) auto}}

/* Fiche projet */
.ptab{display:flex;flex-direction:column;gap:16px}
.pblock{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.pblock h3{display:flex;gap:8px;align-items:center}
.ptab>.grid>.card,.ptab .grid>section.card{box-shadow:none}
.fiche{display:flex;flex-direction:column;gap:10px;margin:0}
.fiche dt{font-size:.72rem;color:var(--muted);font-weight:500}
.fiche dd{margin:2px 0 0;color:var(--ink);font-size:.85rem}
.cprog{display:flex;flex-direction:column;gap:10px}
.dbar{display:grid;grid-template-columns:70px minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:.76rem;margin-top:3px}
.dbar b{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.avb{display:grid;grid-template-columns:minmax(60px,1fr) 38px;gap:8px;align-items:center;min-width:110px}

<script>
"use strict";
/* ================= Utilitaires ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,c='')=>`<i data-lucide="${n}" class="ico ${c}"></i>`;
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function refreshIcons(){try{if(window.lucide)lucide.createIcons({attrs:{'stroke-width':1.75}})}catch(e){}}
const pad=n=>String(n).padStart(2,'0');
const iso=x=>`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const T0=new Date();T0.setHours(0,0,0,0);
const TODAY=iso(T0);
const d=n=>{const x=new Date(T0);x.setDate(x.getDate()+n);return iso(x)};
const addD=(s,n)=>{const x=pd(s);x.setDate(x.getDate()+n);return iso(x)};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MOISL=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const fd=s=>{if(!s)return'—';const x=pd(s);return `${x.getDate()} ${MOIS[x.getMonth()]}`};
const fdy=s=>{const x=pd(s);return `${x.getDate()} ${MOISL[x.getMonth()]} ${x.getFullYear()}`};
const fdl=s=>{const x=pd(s);const j=JOURS[x.getDay()];return `${j[0].toUpperCase()+j.slice(1)} ${x.getDate()} ${MOISL[x.getMonth()]} ${x.getFullYear()}`};
const rel=s=>{const n=diff(TODAY,s);if(n===0)return"aujourd'hui";if(n===1)return'demain';if(n===-1)return'hier';return n>0?`dans ${n} j`:`il y a ${-n} j`};
const fmt=n=>new Intl.NumberFormat('fr-FR').format(n);
const money=n=>fmt(n)+' FCFA';
const mf=n=>(n/1e6).toLocaleString('fr-FR',{maximumFractionDigits:1})+' M';
const pct=(a,b)=>b?Math.round(a/b*100):0;
const isWE=s=>{const w=pd(s).getDay();return w===0||w===6};
const isFerie=s=>!!(S&&S.params&&S.params.feries.some(f=>f.date===s));
const ferieL=s=>{const f=S.params.feries.find(f=>f.date===s);return f?f.l:''};
function joursOuvres(a,b){if(!a||!b||b<a)return 0;let n=0;for(let s=a;s<=b;s=addD(s,1))if(!isWE(s)&&!isFerie(s))n++;return n}
function addOuvres(s,n){let x=s,k=0;while(k<n){x=addD(x,1);if(!isWE(x)&&!isFerie(x))k++}return x}
const overlap=(a1,b1,a2,b2)=>a1<=b2&&a2<=b1;

/* ================= Référentiels ================= */

const PRIO={normale:['Normale','neutral'],urgente:['Urgente','crit'],confidentielle:['Confidentielle','gold']};

/* ================= Données de démonstration ================= */
function mkProjets(){
 const M=1e6,MOA="Bureau National de la CEDEAO — Côte d'Ivoire";let rk=0;
 const C=(pid,n,titre,res)=>({id:pid+'-c'+n,code:'C'+n,titre,res:res?pid+'-r'+res:null});
 const Rz=(pid,n,type,libelle)=>({id:pid+'-r'+n,code:'R'+n,type,libelle});

function cbLabel(id){
  const c=CB[id];
  if(c.multiple){if(!c.value.length)return `<span class="ph">${esc(c.placeholder)}</span>`;const ls=c.value.map(v=>c.options.find(o=>o.v===v)).filter(Boolean).map(o=>o.short||o.l);return esc(ls.length>2?`${ls.slice(0,2).join(', ')} +${ls.length-2}`:ls.join(', '))}

}

function openCb(id,btn){
  closeCb();const host=btn.closest('dialog')||document.body;
  const pop=document.createElement('div');pop.className='cbx-pop';pop.setAttribute('role','dialog');
  pop.innerHTML=`<div class="cbx-search">${ic('search','sm')}<input type="text" placeholder="Rechercher…" aria-label="Rechercher dans la liste"></div><ul class="cbx-list" role="listbox" ${CB[id].multiple?'aria-multiselectable="true"':''}></ul>`;
  host.appendChild(pop);cbOpen={id,pop,btn,hi:0};
  placeCb();renderCbList('');
  const inp=pop.querySelector('input');inp.focus();
  inp.addEventListener('input',()=>{cbOpen.hi=0;renderCbList(inp.value)});
  inp.addEventListener('keydown',e=>{
    const items=[...pop.querySelectorAll('li[data-v]')];
    if(e.key==='ArrowDown'){e.preventDefault();cbOpen.hi=Math.min(items.length-1,cbOpen.hi+1);hiCb(items)}
    else if(e.key==='ArrowUp'){e.preventDefault();cbOpen.hi=Math.max(0,cbOpen.hi-1);hiCb(items)}
    else if(e.key==='Enter'){e.preventDefault();if(items[cbOpen.hi])pickCb(items[cbOpen.hi].dataset.v)}
    else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();const b=cbOpen.btn;closeCb();b.focus()}
    else if(e.key==='Tab'){closeCb()}
  });
  pop.addEventListener('mousedown',e=>{const li=e.target.closest('li[data-v]');if(li){e.preventDefault();pickCb(li.dataset.v)}});
}
function placeCb(){
  if(!cbOpen)return;const r=cbOpen.btn.getBoundingClientRect(),p=cbOpen.pop;
  const w=Math.min(Math.max(r.width,260),window.innerWidth-16);
  let left=Math.min(r.left,window.innerWidth-w-8);left=Math.max(8,left);
  p.style.width=w+'px';p.style.left=left+'px';
  const below=window.innerHeight-r.bottom;
  if(below<300&&r.top>below){p.style.top='auto';p.style.bottom=(window.innerHeight-r.top+4)+'px'}else{p.style.bottom='auto';p.style.top=(r.bottom+4)+'px'}
}
function renderCbList(q){
  const c=CB[cbOpen.id],qq=norm(q);

    return `<li role="option" data-v="${esc(o.v)}" aria-selected="${sel}"><span class="ck">${sel?ic('check','xs'):''}</span><span class="lb">${esc(o.l)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</span></li>`}).join(''):`<li class="none">Aucun résultat</li>`;

function calcConge(){
  const a=cbVal('cg-a'),t=cbVal('cg-t'),db=$('#cg-d').value,fn=$('#cg-f').value,box=$('#cg-calc');if(!box)return;
  if(!db||!fn||fn<db){box.innerHTML=`<div class="note warn">${ic('circle-alert','sm')}<span>La date de fin doit suivre la date de début.</span></div>`;refreshIcons();return}

   if(t==='annuel'&&P(a).solde<j)h+=`<div class="note warn">${ic('circle-alert','sm')}<span>Le solde de ${esc(short(a))} (${p.solde} j) est insuffisant.</span></div>`;

   const mis=S.missions.filter(m=>overlap(db,fn,m.debut,m.fin)&&m.agents.some(x=>x!==a&&P(x).service===p.service)).map(m=>`mission ${m.dest}`);
   if(conf.length||mis.length)h+=`<div class="note warn">${ic('users','sm')}<span>Sur cette période, le service ${SERV[p.service]} compte déjà : ${esc([...conf,...mis].join(', '))}.</span></div>`;
   congeRegles({agent:a,debut:db,fin:fn,interim:cbVal('cg-i')}).forEach(m=>h+=`<div class="note warn">${ic('shield-alert','sm')}<span>${esc(m)}</span></div>`);
   const jal=S.projets.filter(x=>x.chef===a&&x.statut==='cours').flatMap(x=>x.jalons.filter(jj=>!jj.fait&&jj.date>=db&&jj.date<=fn).map(jj=>`${jj.t} (${fd(jj.date)})`));
   if(jal.length)h+=`<div class="note warn">${ic('milestone','sm')}<span>Jalon(s) dont l'agent est responsable pendant l'absence : ${esc(jal.join(', '))}.</span></div>`;
  }
  box.innerHTML=`<div style="display:flex;flex-direction:column;gap:8px">${h}</div>`;refreshIcons();
}
function congeRegles(c){
  const R_=[],p=P(c.agent),C=S.params.conges,ag=S.personnel.filter(x=>x.service===p.service);let worst=0,wd=null;
  for(let s=c.debut;s<=c.fin;s=addD(s,1)){if(isWE(s)||isFerie(s))continue;const n=ag.filter(x=>x.id===c.agent||dispo(x.id,s).k==='conge'||dispo(x.id,s).k==='mission'||S.conges.some(o=>o.id!==c.id&&o.agent===x.id&&o.statut==='attente'&&o.debut<=s&&o.fin>=s)).length;if(n>worst){worst=n;wd=s}}
  const t=pct(worst,ag.length);if(ag.length>=3&&t>C.maxAbs)R_.push(`Taux d'absence du service ${SERV[p.service]} : ${t} % le ${fd(wd)} (maximum autorisé ${C.maxAbs} %).`);
  C.bloquees.filter(b=>overlap(b.debut,b.fin,c.debut,c.fin)).forEach(b=>R_.push(`Période réservée : ${b.motif} (du ${fd(b.debut)} au ${fd(b.fin)}).`));
  if(C.jalon&&!c.interim&&S.projets.some(x=>x.chef===c.agent&&x.statut==='cours'&&x.jalons.some(j=>!j.fait&&j.date>=c.debut&&j.date<=c.fin)))R_.push("Un jalon dont l'agent est responsable tombe pendant le congé : un intérim doit être désigné.");
  return R_;
}

function calChip(x){return `<span class="cal-chip c-${CALC[x.k]} ${x.done?'done':''}" title="${esc((x.h?x.h+' · ':'')+x.t+' — '+(x.s||''))}">${x.h?`<b>${x.h}</b>`:''}<span>${esc(x.t)}</span></span>`}
function weekRow(w,spans,one,opt){

function rapport(){
  const dow=(T0.getDay()+6)%7,lun=d(-dow),ven=d(4-dow),w7=d(-7);
  const act=S.projets.filter(actif),bud=act.reduce((s,p)=>s+p.budget,0),eng=act.reduce((s,p)=>s+p.engage,0);
  const st=S.personnel.map(p=>({p,x:dispo(p.id)}));
  const cg=st.filter(o=>o.x.k==='conge'),ms=st.filter(o=>o.x.k==='mission');
  const ir=S.instructions.filter(instrRetard),io=S.instructions.filter(i=>i.statut==='ouverte');
  const L=[];
  L.push("BUREAU NATIONAL DE LA CEDEAO — CÔTE D'IVOIRE",'Point hebdomadaire d\'activités',`Semaine du ${fdy(lun)} au ${fdy(ven)}`,`Établi le ${fdy(TODAY)}`,'');
  L.push('1. PROJETS ET PROGRAMMES',`Projets actifs : ${act.length}. Exécution budgétaire globale : ${pct(eng,bud)} % (${money(eng)} engagés sur ${money(bud)}).`);
  act.forEach(p=>{const s=sante(p),nj=nextJalon(p);L.push(`- ${p.titre} : avancement ${p.avancement} %, situation « ${s.l} »${nj?`, prochain jalon « ${nj.t} » le ${fd(nj.date)}`:''}.`)});
  const late=act.flatMap(p=>p.jalons.filter(j=>!j.fait&&j.date<TODAY).map(j=>`- ${p.titre} : jalon « ${j.t} » prévu le ${fd(j.date)}, non franchi.`));
  if(late.length)L.push('Points d\'attention :',...late);
  L.push('','2. COURRIER',`Courriers reçus au cours des sept derniers jours : ${S.courriers.filter(k=>k.sens==='arrivee'&&k.date>=w7).length}. Courriers expédiés : ${S.courriers.filter(k=>k.sens==='depart'&&k.date>=w7&&k.etat!=='signature').length}.`,
   `Imputations en attente de validation : ${S.courriers.filter(k=>k.etat==='validation').length}. Courriers départ en attente de signature : ${S.courriers.filter(k=>k.etat==='signature').length}.`,`Délai moyen de traitement constaté : ${delaiMoyen()}.`);
  const hd=S.courriers.filter(horsDelai);
  if(hd.length)L.push('Courriers hors délai :',...hd.map(k=>`- ${k.ref} — ${k.objet} (échéance dépassée de ${diff(k.echeance,TODAY)} jour(s)), imputé à ${k.imputes.filter(x=>!k.traites[x]).map(short).join(', ')}.`));
  L.push('','3. PERSONNEL',`Effectif : ${S.personnel.length} agents ; présents ce jour : ${st.filter(o=>o.x.k==='present').length}.`);
  if(cg.length)L.push(`En congé : ${cg.map(o=>`${short(o.p.id)} (jusqu'au ${fd(o.x.fin)})`).join(', ')}.`);
  if(ms.length)L.push(`En mission : ${ms.map(o=>`${short(o.p.id)} (${o.x.dest}, retour le ${fd(addD(o.x.fin,1))})`).join(', ')}.`);
  L.push(`Demandes de congé en attente de décision : ${S.conges.filter(c=>c.statut==='attente').length}.`,`Postes vacants : ${S.vacants.length} (${S.vacants.map(v=>v.poste.toLowerCase()).join(' ; ')}).`);
  L.push('','4. INSTRUCTIONS DU COORDONNATEUR',`Instructions ouvertes : ${io.length}, dont ${ir.length} en retard.`);
  ir.forEach(i=>L.push(`- ${i.texte} — ${short(i.resp)}, échéance du ${fd(i.echeance)}.`));
  const mz=S.missions;L.push('','5. MISSIONS ET DÉPLACEMENTS',`Missions en cours : ${mz.filter(m=>mStat(m).k==='cours').length}. Demandes à valider : ${mz.filter(m=>m.statut==='demande').length}. Rapports de mission en retard : ${mz.filter(m=>mStat(m).k==='retard').length}.`);
  const bd=S.lignes.reduce((s,l)=>s+l.dotation,0),be=S.lignes.reduce((s,l)=>s+lEng(l),0);L.push('','6. BUDGET',`Taux d'engagement : ${pct(be,bd)} % (${money(be)} sur ${money(bd)}). Engagements en attente de validation : ${S.depenses.filter(x=>x.etape==='proposee').length}.`);
  L.push('','7. MISSION CEDEAO',`Textes communautaires suivis : ${S.textes.length}, dont ${S.textes.filter(txLate).length} avec une échéance dépassée.`,`Signalements reçus sur 7 jours : ${S.signalements.filter(x=>x.date>=w7).length} ; en attente de qualification : ${S.signalements.filter(x=>x.statut==='Reçu').length}.`,`Prochaine réunion statutaire : ${(S.statutaires.filter(r=>r.debut>=TODAY).sort((a,b)=>a.debut<b.debut?-1:1)[0]||{titre:'aucune'}).titre}.`);
  L.push('','8. AGENDA DES SEPT PROCHAINS JOURS');
  feed(7).filter(f=>['reunion','audience','evenement','mission','jalon'].includes(f.k)).forEach(f=>L.push(`- ${fdl(f.date)}${f.h?' à '+f.h.replace(':','h'):''} : ${f.t}.`));
  return L.join('\n');
}

    if(lv===3)add('p1','E-mail et SMS',`Escalade : ${k.ref} non traité par ${short(pid)}, hors délai de ${-n} j.`,`Escalade J+${S.params.esc.coord}`,'crit');
  }));

  S.missions.filter(m=>m.statut==='demande').forEach(m=>add('p1','E-mail',`Demande de mission à ${m.dest} (${m.agents.map(short).join(', ')}) à valider.`,'Validation des missions','info'));
  S.missions.filter(m=>mStat(m).k==='retard').forEach(m=>m.agents.forEach(pid=>add(pid,'E-mail',`Votre rapport de mission (${m.dest}) était attendu le ${fd(rapportDue(m))}.`,`Rapport sous ${S.params.rapportJours} j ouvrés`,'crit')));

function mStat(m){
  if(m.statut==='demande')return{k:'demande',l:'À valider',t:'warn'};if(m.statut==='refusee')return{k:'refusee',l:'Refusée',t:'crit'};
  if(TODAY<m.debut)return{k:'validee',l:'Validée',t:'brand'};if(TODAY<=m.fin)return{k:'cours',l:'En cours',t:'info'};
  if(m.rapport)return{k:'close',l:'Clôturée',t:'ok'};return TODAY>rapportDue(m)?{k:'retard',l:'Rapport en retard',t:'crit'}:{k:'attente',l:'Rapport attendu',t:'warn'};
}

const ETP={proposee:['À valider','warn'],engagee:['Engagée','info'],liquidee:['Liquidée','brand'],payee:['Payée','ok']},ETP_N={proposee:'engagee',engagee:'liquidee',liquidee:'payee'},ETP_A={proposee:"Valider l'engagement",engagee:'Liquider',liquidee:'Payer'};

  form:()=>[{k:'ligne',l:'Ligne budgétaire',t:'sel',req:1,full:1,o:()=>S.lignes.map(l=>({v:l.id,l:`${l.code} — ${l.libelle}`,sub:`Disponible ${money(lDisp(l))}`}))},{k:'objet',l:'Objet',req:1,full:1},{k:'montant',l:'Montant (FCFA)',t:'number',req:1},{k:'beneficiaire',l:'Bénéficiaire',req:1},{k:'activite',l:'Activité de projet imputée',t:'sel',full:1,o:()=>[{v:'',l:'Aucune (fonctionnement)'},...optActs()],hint:"L'engagement validé s'ajoute au budget engagé de l'activité et du projet."}],
  create:f=>{const l=S.lignes.find(x=>x.id===f.ligne);if(!(f.montant>0)){formErr('Indiquez un montant supérieur à zéro.');return null}
    if(f.montant>lDisp(l)){formErr(`Disponible insuffisant sur la ligne ${l.code} : il reste ${money(lDisp(l))}.`);return null}
    const ra=f.activite&&actById(f.activite);if(ra&&f.montant>ra.a.budget-ra.a.engage){formErr(`Le montant dépasse le reste à engager sur l'activité ${ra.a.code} (${money(ra.a.budget-ra.a.engage)}).`);return null}
    return{id:'dp'+Date.now(),num:nextNum(S.depenses,'num','ENG',4),date:TODAY,...f,activite:f.activite||null,projet:ra?ra.p.id:null,etape:'proposee'}},
  created:r=>`Dépense ${r.num} proposée, en attente de validation`,label:r=>r.num,
  onSet:(r,f,v)=>{const ra=r.activite&&actById(r.activite);if(!ra||f!=='etape')return;if(v==='engagee')ra.a.engage+=r.montant;if(v==='payee')ra.a.paye+=r.montant;syncProjet(ra.p);ra.p.journal.push({date:TODAY,auteur:me(),txt:`Dépense ${r.num} ${v==='engagee'?'engagée':v==='payee'?'payée':'liquidée'} sur ${ra.a.code} (${money(r.montant)}).`})},
  setMsg:(r,f,v)=>`dépense ${r.num} ${({engagee:'engagée',liquidee:'liquidée',payee:'payée'})[v]||v}`,
  detail:r=>{const l=S.lignes.find(x=>x.id===r.ligne);return{title:esc(r.objet),sub:`${r.num} · ${ETP[r.etape][0]}`,body:`<dl class="meta"><div><dt>Montant</dt><dd>${money(r.montant)}</dd></div><div><dt>Date</dt><dd>${fdy(r.date)}</dd></div><div><dt>Étape</dt><dd>${pill(...ETP[r.etape])}</dd></div><div style="grid-column:span 2"><dt>Ligne</dt><dd>${l.code} — ${esc(l.libelle)}</dd></div><div><dt>Bénéficiaire</dt><dd>${esc(r.beneficiaire)}</dd></div>${r.activite&&actById(r.activite)?`<div style="grid-column:1/-1"><dt>Imputation</dt><dd>${esc(actById(r.activite).p.code)} · ${actById(r.activite).a.code} ${esc(actById(r.activite).a.titre)}</dd></div>`:''}</dl>
    <div class="steps">${Object.keys(ETP).map(k=>`<span class="${Object.keys(ETP).indexOf(k)<=Object.keys(ETP).indexOf(r.etape)?'on':''}">${ETP[k][0].replace('À valider','Proposée')}</span>`).join('')}</div>`,
    foot:ETP_N[r.etape]&&S.role==='coord'?`<button class="btn primary" data-act="modSet" data-m="depenses" data-id="${r.id}" data-f="etape" data-v="${ETP_N[r.etape]}">${ETP_A[r.etape]}</button>`:''}}};
function vBudget(){
  UI.bt=UI.bt||'lignes';const B=S.lignes,dot=B.reduce((s,l)=>s+l.dotation,0),eng=B.reduce((s,l)=>s+lEng(l),0),liq=B.reduce((s,l)=>s+lLiq(l),0),pay=B.reduce((s,l)=>s+lPay(l),0);

/* ================= Indicateurs de performance ================= */
function perfAgents(){
  return S.personnel.map(p=>{const tr=[],enc=[];S.courriers.filter(k=>k.sens==='arrivee'&&k.imputes.includes(p.id)).forEach(k=>{const t=k.traites[p.id];if(t)tr.push({d:diff(k.date,t.date),ok:!k.echeance||t.date<=k.echeance});else if(k.etat==='cours')enc.push(k)});
    const ins=S.instructions.filter(i=>i.resp===p.id);return{p,n:tr.length,del:tr.length?tr.reduce((s,x)=>s+x.d,0)/tr.length:null,ok:tr.filter(x=>x.ok).length,enc:enc.length,hd:enc.filter(horsDelai).length,ins:ins.length,insR:ins.filter(instrRetard).length}}).filter(x=>x.n||x.enc||x.ins);
}
const estimFin=p=>{if(!(p.avancement>0)||p.statut!=='cours')return null;const el=diff(p.debut,TODAY);return addD(p.debut,Math.round(el/(p.avancement/100)))};
const prevu=p=>Math.max(0,Math.min(100,Math.round(diff(p.debut,TODAY)/Math.max(1,diff(p.debut,p.fin))*100)));
function vIndicateurs(){
  const O=S.params.obj,dow=new Date(T0),labels=[5,4,3,2,1,0].map(i=>{const x=new Date(T0.getFullYear(),T0.getMonth()-i,1);return MOIS[x.getMonth()]});
  const A=perfAgents(),tot=A.reduce((s,x)=>s+x.n,0),ok=A.reduce((s,x)=>s+x.ok,0),act=S.projets.filter(actif);
  const ex=S.instructions.filter(i=>i.statut==='executee'),exok=ex.filter(i=>i.executeeLe<=i.echeance).length;
  const svc=Object.keys(SERV).map(sv=>{const a=A.filter(x=>x.p.service===sv),n=a.reduce((s,x)=>s+x.n,0);return{sv,n,ok:a.reduce((s,x)=>s+x.ok,0),enc:a.reduce((s,x)=>s+x.enc,0),hd:a.reduce((s,x)=>s+x.hd,0)}});
  const pd_=S.perf.delai[5],pt=S.perf.taux[5];
  return pageHead('Indicateurs de performance','Délais de traitement, respect des échéances et avancement prévu ou réalisé des projets, comparés aux objectifs fixés dans les paramètres.')+
  kpis([['Délai moyen du mois',String(pd_).replace('.',',')+'<small> j</small>',`objectif ${O.delai} j`,pd_<=O.delai?'ok':'crit','clock'],['Traités dans les délais',pt+'<small>%</small>',`objectif ${O.taux} %`,pt>=O.taux?'ok':'warn','circle-check'],['Instructions exécutées à temps',ex.length?pct(exok,ex.length)+'<small>%</small>':'—',`${ex.length} exécutée(s)`,'','clipboard-list'],['Projets en retard sur le prévu',act.filter(p=>prevu(p)-p.avancement>10).length,`sur ${act.length} actifs`,act.some(p=>prevu(p)-p.avancement>10)?'warn':'ok','folder-kanban']])+
  `<div class="grid g2"><section class="card"><div class="card-h"><h2>${ic('clock','sm')}Délai moyen de traitement (jours)</h2><span class="count">6 mois</span></div>${barChart(labels,S.perf.delai,O.delai,'j',8,'delai')}</section>
   <section class="card"><div class="card-h"><h2>${ic('circle-check','sm')}Courriers traités dans les délais (%)</h2><span class="count">6 mois</span></div>${barChart(labels,S.perf.taux,O.taux,'%',100,'taux')}</section></div>
  <section class="card"><div class="card-h"><h2>${ic('folder-kanban','sm')}Projets : prévu et réalisé</h2></div>
   ${tbl([{l:'Projet',c:'obj',f:p=>esc(p.titre)},{l:'Prévu à date',c:'num',f:p=>prevu(p)+' %'},{l:'Réalisé',c:'num',f:p=>p.avancement+' %'},{l:'Écart',f:p=>{const e=p.avancement-prevu(p);return pill((e>=0?'+':'')+e+' pts',e>=-5?'ok':e>=-10?'warn':'crit')}},{l:'Fin prévue',c:'num',f:p=>fd(p.fin)},{l:'Fin estimée',c:'num',f:p=>{const e=estimFin(p);return e?fd(e)+(e>p.fin?`<div>${pill('+'+diff(p.fin,e)+' j','crit')}</div>`:''):'—'}}],act,p=>`class="click" data-act="openProjet" data-id="${p.id}" tabindex="0"`)}
   <p class="faint" style="font-size:.76rem">Fin estimée : projection du rythme d'avancement constaté depuis le démarrage.</p></section>
  <div class="grid g2"><section class="card"><div class="card-h"><h2>${ic('users','sm')}Par agent</h2><span class="count">courrier et instructions</span></div>
   ${tbl([{l:'Agent',f:x=>`<span style="color:var(--ink)">${esc(short(x.p.id))}</span>`},{l:'Traités',c:'num',f:x=>x.n},{l:'Délai moyen',c:'num',f:x=>x.del===null?'—':x.del.toLocaleString('fr-FR',{maximumFractionDigits:1})+' j'},{l:'Dans les délais',c:'num',f:x=>x.n?pct(x.ok,x.n)+' %':'—'},{l:'En cours',c:'num',f:x=>x.enc+(x.hd?` ${pill(x.hd+' hors délai','crit')}`:'')},{l:'Instructions',c:'num',f:x=>x.ins+(x.insR?` ${pill(x.insR+' en retard','crit')}`:'')}],A)}</section>
   <section class="card"><div class="card-h"><h2>${ic('building-2','sm')}Par service</h2></div>
   ${tbl([{l:'Service',f:x=>`<span style="color:var(--ink)">${SERV[x.sv]}</span>`},{l:'Traités',c:'num',f:x=>x.n},{l:'Dans les délais',c:'num',f:x=>x.n?pct(x.ok,x.n)+' %':'—'},{l:'En cours',c:'num',f:x=>x.enc},{l:'Hors délai',c:'num',f:x=>x.hd?pill(x.hd,'crit'):'0'}],svc)}
   <p class="faint" style="font-size:.76rem">Historique mensuel de démonstration ; les tableaux par agent et par service sont calculés sur les données du POC.</p></section></div>`;
}
function planChart(p){
  if(!p.suivi||!p.suivi.length)return '';const W=520,H=170,l=34,b=24,t=10,r=10,iw=W-l-r,ih=H-b-t,span=Math.max(1,diff(p.debut,p.fin)),est=estimFin(p);
  const end=est&&est>p.fin?est:p.fin,tot=Math.max(span,diff(p.debut,end)),X=s=>l+Math.max(0,diff(p.debut,s))/tot*iw,Y=v=>t+ih-v/100*ih;
  let g='';[0,50,100].forEach(v=>{g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-2)" stroke-dasharray="${v?'3 4':''}"/><text x="${l-6}" y="${Y(v)+3}" text-anchor="end">${v} %</text>`});
  g+=`<line x1="${X(p.debut)}" y1="${Y(0)}" x2="${X(p.fin)}" y2="${Y(100)}" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="6 4"/>`;
  const pts=[{date:p.debut,v:0},...p.suivi];g+=`<polyline fill="none" stroke="var(--brand)" stroke-width="2.5" points="${pts.map(x=>X(x.date)+','+Y(x.v)).join(' ')}"/>`;
  pts.slice(1).forEach(x=>g+=`<circle cx="${X(x.date)}" cy="${Y(x.v)}" r="3.5" fill="var(--brand)"><title>${fd(x.date)} : ${x.v} %</title></circle>`);
  if(est&&p.statut==='cours'){const last=pts[pts.length-1];g+=`<line x1="${X(last.date)}" y1="${Y(last.v)}" x2="${X(est)}" y2="${Y(100)}" stroke="var(--brand)" stroke-width="1.5" stroke-dasharray="2 4"/><circle cx="${X(est)}" cy="${Y(100)}" r="4" fill="var(--surface)" stroke="var(--brand)" stroke-width="2"/>`}
  if(TODAY>=p.debut&&TODAY<=end)g+=`<line x1="${X(TODAY)}" x2="${X(TODAY)}" y1="${t}" y2="${t+ih}" stroke="var(--crit)" stroke-width="1"/>`;
  g+=`<text x="${X(p.debut)}" y="${H-6}">${fd(p.debut)}</text><text x="${X(p.fin)}" y="${H-6}" text-anchor="middle">fin prévue ${fd(p.fin)}</text>`;
  return `<section class="card"><div class="card-h"><h2>${ic('trending-up','sm')}Prévu et réalisé</h2>${est&&p.statut==='cours'?`<span class="count">fin estimée ${fd(est)}${est>p.fin?' · +'+diff(p.fin,est)+' j':''}</span>`:''}</div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Avancement prévu et réalisé">${g}</svg></div><div class="legend"><span><i style="background:var(--faint)"></i>Prévu (linéaire)</span><span><i style="background:var(--brand)"></i>Réalisé</span><span><i style="background:var(--crit)"></i>Aujourd'hui</span></div></section>`;
}

function docGen(k,id){
  if(k==='integ'||k==='certif'){docOb(k,id);return}
  const H="BUREAU NATIONAL DE LA CEDEAO — CÔTE D'IVOIRE",co=P('p1'),L=[];
  if(k==='om'){const m=S.missions.find(x=>x.id===id);
    L.push(H,'',`ORDRE DE MISSION N° ${m.ordre}`,'',`Le Coordonnateur du Bureau National de la CEDEAO autorise :`,...m.agents.map(a=>`  - ${P(a).civ} ${nm(a)}, ${P(a).poste}`),'',`à se rendre à : ${m.dest}`,`Objet de la mission : ${m.objet}`,`Période : du ${fdy(m.debut)} au ${fdy(m.fin)} (${mJours(m)} jour${mJours(m)>1?'s':''})`,`Moyen de transport : ${m.transport}`,`Prise en charge : indemnités journalières au barème en vigueur (zone « ${m.zone} »), soit ${money(indem(m))} au total.`,'',`Un rapport de mission sera déposé au plus tard le ${fdy(rapportDue(m))}.`,'',`Fait à Abidjan, le ${fdy(TODAY)}`,'','Le Coordonnateur','[Signature et cachet]',`${co.civ} ${co.nom}`);
    docView('Ordre de mission',L.join('\n'));return}
  if(k==='conge'){const c=S.conges.find(x=>x.id===id),p=P(c.agent);
    L.push(H,'',`DÉCISION N° [à attribuer] portant ${TCONGE[c.type].toLowerCase()}`,'','Le Coordonnateur du Bureau National de la CEDEAO,','Vu [textes de référence à préciser] ;','Vu la demande de l\'intéressé(e) ;','','DÉCIDE :','',`Article 1 : Un ${TCONGE[c.type].toLowerCase()} de ${congeJours(c)} jour(s) ouvré(s) est accordé à ${p.civ} ${p.nom}, ${p.poste}, du ${fdy(c.debut)} au ${fdy(c.fin)} inclus.`,`Article 2 : ${c.interim?`L'intérim est assuré par ${P(c.interim).civ} ${nm(c.interim)}, ${P(c.interim).poste}.`:"Aucun intérim n'est désigné."}`,`Article 3 : L'intéressé(e) reprendra son service le ${fdy(addOuvres(c.fin,1))}.`,'Article 4 : La présente décision prend effet à compter de sa date de signature.','',`Fait à Abidjan, le ${fdy(TODAY)}`,'','Le Coordonnateur','[Signature et cachet]',`${co.civ} ${co.nom}`);
    docView('Décision de congé',L.join('\n'));return}
  if(k==='attest'){const p=P(id);
    L.push(H,'','ATTESTATION DE TRAVAIL','',`Je soussigné, ${co.civ} ${co.nom}, Coordonnateur du Bureau National de la CEDEAO en Côte d'Ivoire, atteste que ${p.civ} ${p.nom} est en service au Bureau National depuis ${p.entree}, en qualité de ${p.poste.charAt(0).toLowerCase()+p.poste.slice(1)}${p.grade?' (catégorie '+p.grade+')':''}.`,'','En foi de quoi, la présente attestation lui est délivrée pour servir et valoir ce que de droit.','',`Fait à Abidjan, le ${fdy(TODAY)}`,'','Le Coordonnateur','[Signature et cachet]');
    docView('Attestation de travail',L.join('\n'));return}
  if(k==='presence'){docView('Feuille de présence',feuillePresence(S.reunions.find(x=>x.id===id)));return}
  if(k==='rap'){docView("Rapport d'avancement",rapportProjet(PJ(id)));return}
  if(k==='bord'){const c=K(id);
    L.push(H,'',`BORDEREAU D'ENVOI N° ${c.ref}`,'',`Destinataire : ${c.corresp}`,'','Désignation des pièces : '+c.objet,'Nombre : [1]','Observations : Transmis pour information et suite à donner.','',`Fait à Abidjan, le ${fdy(c.date)}`,'','Le Coordonnateur','[Signature et cachet]');
    docView("Bordereau d'envoi",L.join('\n'));return}
}

function actAv(a){return a.sous&&a.sous.length?Math.round(a.sous.reduce((s,x)=>s+(+x.av||0),0)/a.sous.length):(+a.av||0)}
function actStat(a){const v=actAv(a);if(v>=100)return{k:'fait',l:'Terminée',t:'ok'};if(a.fin<TODAY)return{k:'retard',l:'En retard',t:'crit'};if(a.debut>TODAY&&!v)return{k:'avenir',l:'Non démarrée',t:'neutral'};if(a.debut<=TODAY&&!v)return{k:'demarrer',l:'À démarrer',t:'warn'};return{k:'cours',l:'En cours',t:'info'}}
function sousStat(x){if(x.av>=100)return{l:'Terminée',t:'ok'};if(x.fin<TODAY)return{l:'En retard',t:'crit'};if(x.av>0)return{l:'En cours',t:'info'};return{l:'Non démarrée',t:'neutral'}}
function syncProjet(p){if(!p.activites||!p.activites.length)return;const A=p.activites,B=A.reduce((s,a)=>s+a.budget,0);p.budget=B;p.engage=A.reduce((s,a)=>s+a.engage,0);p.paye=A.reduce((s,a)=>s+a.paye,0);p.avancement=B?Math.round(A.reduce((s,a)=>s+actAv(a)*a.budget,0)/B):0}

function rapportProjet(p){
  const L=[],acc=finAcc(p),rec=finRecu(p),q=Math.floor(T0.getMonth()/3),qs=iso(new Date(T0.getFullYear(),q*3,1));
  L.push("BUREAU NATIONAL DE LA CEDEAO — CÔTE D'IVOIRE",'',"RAPPORT D'AVANCEMENT DU PROJET",`${p.titre} (${p.code})`,`Période couverte : du ${fdy(qs)} au ${fdy(TODAY)}`,`Établi le ${fdy(TODAY)}`,'');
  L.push('1. RAPPEL DU PROJET',`Objectif global : ${p.objGlobal||'[à compléter]'}`,`Objectif spécifique : ${p.objSpec||'[à compléter]'}`,`Chef de projet : ${nm(p.chef)}. Période d'exécution : du ${fdy(p.debut)} au ${fdy(p.fin)}.`,`Zone d'intervention : ${p.zone||'[à compléter]'}.`,'');
  L.push('2. ÉTAT D\'AVANCEMENT GLOBAL',`Avancement physique : ${p.avancement} % (prévu à date : ${prevu(p)} %).`,`Exécution financière : ${money(p.engage)} engagés, soit ${pct(p.engage,p.budget)} % du coût total de ${money(p.budget)} ; ${money(p.paye||0)} payés.`,`Mobilisation des financements : ${money(rec)} reçus sur ${money(acc)} accordés (${pct(rec,acc)} %).`,estimFin(p)?`Date de fin estimée au rythme actuel : ${fdy(estimFin(p))} (fin prévue : ${fdy(p.fin)}).`:'','');
  L.push('3. AVANCEMENT PAR COMPOSANTE');(p.composantes||[]).forEach(c=>L.push(`- ${c.code} ${c.titre} : avancement physique ${compAv(p,c)} %, budget ${money(compSum(p,c,'budget'))}, engagé ${money(compSum(p,c,'engage'))}.`));
  const lt=(p.activites||[]).filter(a=>actStat(a).k==='retard');L.push('','4. ACTIVITÉS EN RETARD');if(lt.length)lt.forEach(a=>L.push(`- ${a.code} ${a.titre} : échéance du ${fd(a.fin)}, avancement ${actAv(a)} %, responsable ${short(a.resp)}.`));else L.push('Aucune activité en retard.');
  L.push('','5. JALONS');p.jalons.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(j=>L.push(`- ${fd(j.date)} — ${j.t} : ${j.fait?'franchi':j.date<TODAY?'en retard':'à venir'}${j.livrable?' (livrable : '+j.livrable+')':''}.`));
  L.push('','6. INDICATEURS DE RÉSULTAT');(p.indicateurs||[]).forEach(i=>L.push(`- ${i.code} ${i.libelle} : référence ${fmtN(i.ref)} (${i.refA}), cible ${fmtN(i.cible)}, réalisé ${fmtN(i.real)} ${i.unite}, taux d'atteinte ${indTaux(i)} %.`));
  L.push('','7. FINANCEMENTS ET DÉCAISSEMENTS');(p.financements||[]).forEach(f=>{L.push(`- ${f.bailleur} (${f.convention}) : ${money(f.montant)} accordés.`);f.tranches.forEach(t=>L.push(`    ${t.lib} : ${money(t.montant)}, prévue le ${fd(t.prevue)} — ${t.recue?'reçue le '+fd(t.recue):t.prevue<TODAY?'en retard':'attendue'}${t.cond?' ; condition : '+t.cond:''}.`))});
  if(rec<p.engage)L.push(`Les engagements dépassent les fonds reçus de ${money(p.engage-rec)}.`);
  L.push('','8. RISQUES ET MESURES D\'ATTÉNUATION');(p.risques||[]).filter(r=>r.statut!=='Maîtrisé').forEach(r=>L.push(`- ${r.t} (probabilité ${r.prob.toLowerCase()}, impact ${r.impact.toLowerCase()}) : ${r.mitig}`));
  const nx=(p.activites||[]).filter(a=>a.debut>=TODAY&&a.debut<=d(30)),nj=p.jalons.filter(j=>!j.fait&&j.date>=TODAY&&j.date<=d(30));L.push('','9. PROCHAINES ÉTAPES (30 JOURS)');nx.forEach(a=>L.push(`- Démarrage de ${a.code} ${a.titre} le ${fd(a.debut)}.`));nj.forEach(j=>L.push(`- Jalon « ${j.t} » prévu le ${fd(j.date)}.`));if(!nx.length&&!nj.length)L.push('[À compléter]');
  L.push('','Le Chef de projet','[Signature]',nm(p.chef));
  return L.filter(x=>x!==undefined).join('\n');
}

/* ================= Émargement des réunions par QR code ================= */
const QR_PERIOD=30;
function qrToken(r,t){const slot=Math.floor((t||Date.now())/(QR_PERIOD*1000));let h=2166136261;const s=r.id+'|'+r.date+'|'+slot;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36).toUpperCase().slice(0,6).padStart(6,'0')}
function qrUrl(r){return `https://bureau-national-cedeao-ci.org/emargement?r=${r.id}&c=${qrToken(r)}`}
function qrSvg(text,size){
  if(!window.qrcode)return `<div class="qr-miss">Le générateur de QR code n'a pas pu être chargé (connexion requise).</div>`;
  const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),m=4,N=n+m*2;let p='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p+=`M${c+m},${r+m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${N} ${N}" width="${size}" height="${size}" role="img" aria-label="QR code d'émargement" shape-rendering="crispEdges"><rect width="${N}" height="${N}" fill="#fff"/><path d="${p}" fill="#0F2A1A"/></svg>`;
}
const presOf=(r,pid)=>(r.presences||[]).find(x=>x.pid===pid);
const presLate=(r,x)=>{const[h,m]=r.heure.split(':').map(Number),[h2,m2]=x.heure.split(':').map(Number);return h2*60+m2>h*60+m+15};
function presBlock(r){
  const P_=r.presences||[],int=r.participants,ok=int.filter(pid=>presOf(r,pid)).length,ext=P_.filter(x=>!x.pid),open=r.date===TODAY&&r.statut!=='CR validé';
  return `<div class="pres-b"><div class="pres-h"><div><h3>Feuille de présence</h3><p class="faint" style="font-size:.78rem">${ok} présent${ok>1?'s':''} sur ${int.length} convoqué${int.length>1?'s':''}${ext.length?` · ${ext.length} participant${ext.length>1?'s':''} externe${ext.length>1?'s':''}`:''}</p></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap">${open&&canEdit()?`<button class="btn sm primary" data-act="qrShow" data-id="${r.id}">${ic('qr-code','xs')}QR code d'émargement</button>`:''}${P_.length?`<button class="btn sm" data-act="docGen" data-k="presence" data-id="${r.id}">${ic('file-text','xs')}Feuille de présence</button>`:''}</div></div>
   ${!open&&r.date>TODAY?`<p class="note" style="margin:0">${ic('info','sm')}<span>Le QR code d'émargement sera disponible le jour de la réunion.</span></p>`:''}
   <div class="pres-l">${int.map(pid=>{const x=presOf(r,pid);return `<div><span class="av">${esc(ini(pid))}</span><span class="ml">${esc(short(pid))}</span>${x?pill((presLate(r,x)?'En retard · ':'Présent · ')+x.heure+(x.mode==='QR'?' · QR':''),presLate(r,x)?'warn':'ok'):r.date<=TODAY&&r.statut!=='Planifiée'?pill('Absent','crit'):pill('Attendu','neutral')}${!x&&open&&canEdit()?`<button class="btn sm ghost" data-act="presManuel" data-id="${r.id}" data-p="${pid}" title="Marquer présent manuellement">${ic('user-check','xs')}</button>`:''}</div>`}).join('')}
   ${ext.map(x=>`<div><span class="av more">EX</span><span class="ml">${esc(x.nom)} <span class="faint">· ${esc(x.structure)}</span></span>${pill('Externe · '+x.heure,'info')}</div>`).join('')}</div></div>`;
}
let qrTimer=null;
function qrShow(id){
  const r=S.reunions.find(x=>x.id===id);clearInterval(qrTimer);
  openDlg({title:'Émargement par QR code',sub:`${esc(r.titre)} · ${fdl(r.date)} · ${r.heure}`,body:`<div class="qr-wrap"><div class="qr-box" id="qr-box">${qrSvg(qrUrl(r),260)}</div>
   <div class="qr-info"><p style="color:var(--ink);font-weight:600">Les participants scannent ce code avec l'appareil photo de leur téléphone, puis confirment leur nom.</p>
   <div class="qr-cd"><div class="bar thin"><i id="qr-bar" style="width:100%"></i></div><span>Code <b class="mono" id="qr-tok">${qrToken(r)}</b> · renouvelé dans <b id="qr-s">${QR_PERIOD}</b> s</span></div>
   <ul class="qr-rules"><li>Le code change toutes les ${QR_PERIOD} secondes : une photo transmise hors de la salle devient vite inutilisable.</li><li>Il n'est valable que le jour de la réunion, et une seule fois par participant.</li><li>Une arrivée plus de 15 minutes après l'heure prévue est marquée « en retard ».</li></ul>
   <p class="faint" style="font-size:.74rem">En production, le code renvoie vers la page d'émargement de la plateforme. Dans le POC, utilisez le bouton ci-dessous pour simuler le scan.</p></div></div>`,
   foot:`<button class="btn" data-act="modOpen" data-m="reunions" data-id="${r.id}">${ic('arrow-left','sm')}Retour à la réunion</button><button class="btn primary" data-act="emarg" data-id="${r.id}">${ic('smartphone-nfc','sm')}Simuler un scan</button>`,wide:true});
  const tick=()=>{if(!$('#qr-box')){clearInterval(qrTimer);return}const s=QR_PERIOD-Math.floor(Date.now()/1000)%QR_PERIOD;$('#qr-s').textContent=s;$('#qr-bar').style.width=(s/QR_PERIOD*100)+'%';const t=qrToken(r);if($('#qr-tok').textContent!==t){$('#qr-tok').textContent=t;$('#qr-box').innerHTML=qrSvg(qrUrl(r),260)}};
  tick();qrTimer=setInterval(tick,1000);
}
function emarg(id){
  clearInterval(qrTimer);const r=S.reunions.find(x=>x.id===id);
  if(!r){toast('Réunion introuvable.','circle-alert');return}
  const opts=[...r.participants.filter(pid=>!presOf(r,pid)).map(pid=>({v:pid,l:nm(pid),sub:P(pid).poste})),{v:'ext',l:'Je suis un participant externe',sub:'Invité, partenaire, point focal'}];
  openDlg({title:'Confirmer ma présence',sub:'BNC 360 · émargement',body:`<div class="phone"><div class="phone-h"><span class="logo-s"></span><b>Bureau National CEDEAO</b></div>
   <div class="phone-c"><p class="eyebrow">Réunion</p><h3>${esc(r.titre)}</h3><p class="muted" style="font-size:.82rem">${fdl(r.date)} · ${r.heure} · ${esc(r.lieu)}</p>
   ${r.date!==TODAY?`<div class="note warn">${ic('circle-alert','sm')}<span>L'émargement n'est ouvert que le jour de la réunion.</span></div>`:`
   <div class="f"><span class="lbl">Votre nom</span>${cbx('em-p',{value:'',options:opts,placeholder:'Rechercher votre nom',onChange:v=>{$('#em-ext').hidden=v!=='ext'}})}</div>
   <div id="em-ext" hidden class="fgrid" style="grid-template-columns:1fr"><div class="f"><label for="em-n">Nom et prénom</label><input type="text" id="em-n"></div><div class="f"><label for="em-s">Structure</label><input type="text" id="em-s"></div></div>
   <p class="ferr" id="f-err" hidden></p>
   <button class="btn primary" style="justify-content:center;width:100%;padding:11px" data-act="emargOk" data-id="${r.id}" data-tok="${qrToken(r)}">${ic('check','sm')}Je confirme ma présence</button>`}</div></div>`,foot:`<button class="btn ghost" data-act="closeDlg">Fermer</button>`});
}
function emargOk(a){
  const r=S.reunions.find(x=>x.id===a.dataset.id),v=cbVal('em-p');
  if(a.dataset.tok!==qrToken(r)&&a.dataset.tok!==qrToken(r,Date.now()-QR_PERIOD*1000)){formErr('Ce QR code a expiré. Scannez le code affiché en salle.');return}
  if(!v){formErr('Choisissez votre nom dans la liste.');return}
  const t=new Date(),h=pad(t.getHours())+':'+pad(t.getMinutes());r.presences=r.presences||[];
  if(v==='ext'){const n=$('#em-n').value.trim(),st=$('#em-s').value.trim();if(!n||!st){formErr('Indiquez votre nom et votre structure.');return}r.presences.push({pid:null,nom:n,structure:st,heure:h,mode:'QR'})}
  else{if(presOf(r,v)){formErr('Votre présence est déjà enregistrée.');return}r.presences.push({pid:v,heure:h,mode:'QR'})}
  if(r.statut==='Planifiée')r.statut='Tenue';
  save();const who=v==='ext'?$('#em-n').value.trim():nm(v);
  $('#dlg .dlg-b').innerHTML=`<div class="phone"><div class="phone-h"><span class="logo-s"></span><b>Bureau National CEDEAO</b></div><div class="phone-c" style="align-items:center;text-align:center;padding:28px 18px"><span class="ok-ring">${ic('check')}</span><h3>Présence enregistrée</h3><p class="muted">${esc(who)} · ${h}</p><p class="faint" style="font-size:.78rem">Vous pouvez fermer cette page.</p></div></div>`;
  $('#dlg .dlg-f').innerHTML=`<button class="btn" data-act="emarg" data-id="${r.id}">${ic('repeat','sm')}Simuler un autre scan</button><button class="btn primary" data-act="modOpen" data-m="reunions" data-id="${r.id}">Voir la feuille de présence</button>`;
  refreshIcons();if(UI.view==='reunions')render();
}
Object.assign(ACT,{
 qrShow:a=>qrShow(a.dataset.id),emarg:a=>emarg(a.dataset.id),emargOk:a=>emargOk(a),
 presManuel:a=>{const r=S.reunions.find(x=>x.id===a.dataset.id),t=new Date();(r.presences=r.presences||[]).push({pid:a.dataset.p,heure:pad(t.getHours())+':'+pad(t.getMinutes()),mode:'Manuel'});save();render();openDetail('reunions',r.id);toast(`${short(a.dataset.p)} marqué(e) présent(e)`)}
});
Object.assign(AUD,{emargOk:a=>`Émargement par QR code — ${S.reunions.find(x=>x.id===a.dataset.id).titre}`,presManuel:a=>`Présence saisie manuellement : ${nm(a.dataset.p)}`});
function feuillePresence(r){
  const L=["BUREAU NATIONAL DE LA CEDEAO — CÔTE D'IVOIRE",'','FEUILLE DE PRÉSENCE',r.titre,`${fdl(r.date)} à ${r.heure.replace(':','h')} — ${r.lieu}`,''];
  L.push('Agents du Bureau convoqués :');r.participants.forEach((pid,i)=>{const x=presOf(r,pid);L.push(`${String(i+1).padStart(2,'0')}. ${nm(pid)}, ${P(pid).poste} — ${x?(presLate(r,x)?'présent (arrivée tardive)':'présent')+' à '+x.heure.replace(':','h')+(x.mode==='QR'?', émargement par QR code':', saisie manuelle'):'absent'}`)});
  const ext=(r.presences||[]).filter(x=>!x.pid);if(ext.length){L.push('','Participants externes :');ext.forEach((x,i)=>L.push(`${String(i+1).padStart(2,'0')}. ${x.nom}, ${x.structure} — présent à ${x.heure.replace(':','h')}`))}
  const ok=r.participants.filter(pid=>presOf(r,pid)).length;L.push('',`Taux de présence des agents convoqués : ${pct(ok,r.participants.length)} % (${ok} sur ${r.participants.length}).`,'',`Arrêtée le ${fdy(TODAY)}`,'','Le Secrétariat de Direction','[Signature]');
  return L.join('\n');
}

/* ================= Démarrage ================= */
(function(){const h=(location.hash||'').slice(1);if(NAV.some(n=>n.v===h))UI.view=h;if(h.startsWith('emargement-')){UI.view='reunions';setTimeout(()=>emarg(h.slice(11)),50)}})();
render();
if(!window.lucide){window.addEventListener('load',refreshIcons)}
</script>
</body>
</html>
